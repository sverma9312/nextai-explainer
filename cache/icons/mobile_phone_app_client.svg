<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <linearGradient id="phoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" rx="22" fill="url(#bgGrad)" />

  <!-- Ambient Glow -->
  <circle cx="50" cy="50" r="30" fill="#6366F1" opacity="0.25" filter="url(#glow)" />

  <!-- Phone Body -->
  <rect x="29" y="14" width="42" height="72" rx="9" fill="url(#phoneGrad)" />
  
  <!-- Inner Bezel / Screen -->
  <rect x="32" y="17" width="36" height="66" rx="7" fill="url(#screenGrad)" />

  <!-- Dynamic Island / Speaker -->
  <rect x="42" y="21" width="16" height="3" rx="1.5" fill="#334155" />

  <!-- App UI Elements: Client / User Avatar -->
  <circle cx="50" cy="38" r="8" fill="url(#accentGrad)" />
  <path d="M 39 55 C 39 50, 44 48, 50 48 C 56 48, 61 50, 61 55 Z" fill="url(#accentGrad)" />

  <!-- App UI Elements: Data / Connection Nodes (Client concept) -->
  <circle cx="38" cy="67" r="3" fill="#22D3EE" />
  <rect x="44" y="65" width="18" height="4" rx="2" fill="#334155" />

  <circle cx="38" cy="76" r="3" fill="#A855F7" />
  <rect x="44" y="74" width="14" height="4" rx="2" fill="#334155" />

  <!-- Floating Connection Indicator / Wifi-Sparkles -->
  <path d="M 72 26 L 76 22 M 77 27 L 81 25" stroke="#22D3EE" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="68" cy="30" r="2" fill="#22D3EE" />

  <!-- Bottom Home Bar -->
  <rect x="41" y="79" width="18" height="2" rx="1" fill="#64748B" />
</svg>