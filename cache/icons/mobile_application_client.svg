<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="phoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="userGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" rx="22" fill="url(#bgGrad)" />

  <!-- Abstract Network / Client Connection Nodes -->
  <path d="M 22 32 L 35 22 M 78 32 L 65 22 M 22 68 L 35 78 M 78 68 L 65 78" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" opacity="0.3" />
  <circle cx="22" cy="32" r="3" fill="#38BDF8" opacity="0.5" />
  <circle cx="78" cy="32" r="3" fill="#A855F7" opacity="0.5" />
  <circle cx="22" cy="68" r="3" fill="#10B981" opacity="0.5" />
  <circle cx="78" cy="68" r="3" fill="#F59E0B" opacity="0.5" />

  <!-- Mobile Device Outer Frame -->
  <rect x="30" y="14" width="40" height="72" rx="8" fill="url(#phoneGrad)" filter="url(#glow)" />
  
  <!-- Screen Area -->
  <rect x="33" y="17" width="34" height="66" rx="6" fill="#0F172A" />

  <!-- Dynamic UI Elements inside App -->
  <!-- Status Bar / Notch indicator -->
  <rect x="45" y="20" width="10" height="2" rx="1" fill="#334155" />
  
  <!-- App Header / Dashboard Card -->
  <rect x="37" y="26" width="26" height="14" rx="3" fill="#1E293B" />
  <circle cx="42" cy="33" r="3" fill="#22D3EE" />
  <rect x="48" y="31" width="11" height="2" rx="1" fill="#E2E8F0" />
  <rect x="48" y="35" width="8" height="1.5" rx="0.75" fill="#64748B" />

  <!-- Client / User Profile Graphic (The "Client" focus) -->
  <circle cx="50" cy="52" r="9" fill="url(#userGrad)" />
  <!-- User Silhouette -->
  <path d="M 50 46 C 47.8 46 46 47.8 46 50 C 46 50.8 46.3 51.5 46.7 52.1 C 44.8 53.2 43.5 55.2 43.5 57.5 L 56.5 57.5 C 56.5 55.2 55.2 53.2 53.3 52.1 C 53.7 51.5 54 50.8 54 50 C 54 47.8 52.2 46 50 46 Z" fill="#0F172A" />

  <!-- Interactive App Rows / Client Data -->
  <rect x="37" y="65" width="26" height="5" rx="2.5" fill="#38BDF8" opacity="0.8" />
  <rect x="37" y="73" width="26" height="5" rx="2.5" fill="#A855F7" opacity="0.8" />

  <!-- Home Indicator Bar -->
  <rect x="42" y="80" width="16" height="2" rx="1" fill="#64748B" />
</svg>