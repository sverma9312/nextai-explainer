<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>

    <!-- Gateway / Core Gradient (Cyan to Blue) -->
    <linearGradient id="gatewayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- Upstream Service 1 (Emerald) -->
    <linearGradient id="service1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Upstream Service 2 (Violet) -->
    <linearGradient id="service2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <!-- Upstream Service 3 (Amber) -->
    <linearGradient id="service3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" rx="20" fill="url(#bgGrad)" />

  <!-- Routing Lines / Network Flows -->
  <g fill="none" stroke-linecap="round" stroke-width="2">
    <!-- Incoming to Gateway -->
    <path d="M 15 50 L 37 50" stroke="#22D3EE" stroke-dasharray="3 3" opacity="0.6" />
    
    <!-- Gateway to Top Service -->
    <path d="M 63 35 C 70 35, 73 25, 80 25" stroke="url(#service1Grad)" />
    <!-- Gateway to Middle Service -->
    <path d="M 63 50 L 80 50" stroke="url(#service2Grad)" />
    <!-- Gateway to Bottom Service -->
    <path d="M 63 65 C 70 65, 73 75, 80 75" stroke="url(#service3Grad)" />
  </g>

  <!-- Incoming Request Nodes (Clients) -->
  <g transform="translate(10, 50)">
    <circle cx="0" cy="0" r="5" fill="#22D3EE" filter="url(#glow)" />
    <circle cx="0" cy="0" r="2" fill="#FFFFFF" />
  </g>

  <!-- Central API Gateway / Proxy Node (Hexagon) -->
  <g transform="translate(50, 50)" filter="url(#glow)">
    <!-- Outer Hexagon Ring -->
    <polygon points="0,-22 19,-11 19,11 0,22 -19,11 -19,-11" fill="none" stroke="#22D3EE" stroke-width="1.5" opacity="0.4" />
    <!-- Main Hexagon Core -->
    <polygon points="0,-17 14.7,-8.5 14.7,8.5 0,17 -14.7,8.5 -14.7,-8.5" fill="url(#gatewayGrad)" />
    
    <!-- Inner Proxy Symbol (Arrows / Interchange) -->
    <path d="M -5 -4 L 2 -4 L -2 -9 L 7 -4 L 2 1 L 2 -1" fill="#FFFFFF" />
    <path d="M 5 4 L -2 4 L 2 9 L -7 4 L -2 -1 L -2 1" fill="#FFFFFF" />
  </g>

  <!-- Upstream Services (Destination Nodes) -->
  <!-- Service 1 (Top) -->
  <g transform="translate(85, 25)" filter="url(#glow)">
    <rect x="-7" y="-7" width="14" height="14" rx="3.5" fill="url(#service1Grad)" />
    <!-- Node Icon: Microservice grid -->
    <circle cx="-2.5" cy="-2.5" r="1.5" fill="#FFFFFF" />
    <circle cx="2.5" cy="-2.5" r="1.5" fill="#FFFFFF" />
    <circle cx="-2.5" cy="2.5" r="1.5" fill="#FFFFFF" />
    <circle cx="2.5" cy="2.5" r="1.5" fill="#FFFFFF" />
  </g>

  <!-- Service 2 (Middle) -->
  <g transform="translate(85, 50)" filter="url(#glow)">
    <rect x="-7" y="-7" width="14" height="14" rx="3.5" fill="url(#service2Grad)" />
    <!-- Node Icon: Database/Server layers -->
    <path d="M -3.5 -4 L 3.5 -4 M -3.5 0 L 3.5 0 M -3.5 4 L 3.5 4" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Service 3 (Bottom) -->
  <g transform="translate(85, 75)" filter="url(#glow)">
    <rect x="-7" y="-7" width="14" height="14" rx="3.5" fill="url(#service3Grad)" />
    <!-- Node Icon: Cloud/Shield -->
    <path d="M 0 -4.5 L 4 -2 L 4 2 L 0 4.5 L -4 2 L -4 -2 Z" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round" />
  </g>

  <!-- Active Data Packets / Pulses -->
  <circle cx="28" cy="50" r="2" fill="#FFFFFF" filter="url(#glow)" />
  <circle cx="71" cy="30" r="1.5" fill="#34D399" filter="url(#glow)" />
  <circle cx="71" cy="50" r="1.5" fill="#C084FC" filter="url(#glow)" />
  <circle cx="71" cy="70" r="1.5" fill="#FBBF24" filter="url(#glow)" />
</svg>