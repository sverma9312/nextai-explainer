<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>

    <!-- Gateway Core Gradient (Violet/Cyan) -->
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0% " stop-color="#A855F7" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>

    <!-- Client Nodes Gradient (Cyan) -->
    <linearGradient id="clientGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Service Nodes Gradient (Emerald) -->
    <linearGradient id="serviceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" rx="18" fill="url(#bgGrad)" />

  <!-- Connection Paths (Routing Lines) -->
  <g fill="none" stroke-linecap="round">
    <!-- Left to Center -->
    <path d="M 27 30 C 37 30, 37 50, 50 50" stroke="#22D3EE" stroke-width="2.5" opacity="0.6" />
    <path d="M 27 70 C 37 70, 37 50, 50 50" stroke="#22D3EE" stroke-width="2.5" opacity="0.6" />
    
    <!-- Center to Right -->
    <path d="M 50 50 C 63 50, 63 24, 73 24" stroke="#34D399" stroke-width="2.5" opacity="0.6" />
    <path d="M 50 50 C 63 50, 63 50, 73 50" stroke="#34D399" stroke-width="2.5" opacity="0.6" />
    <path d="M 50 50 C 63 50, 63 76, 73 76" stroke="#34D399" stroke-width="2.5" opacity="0.6" />
  </g>

  <!-- Data Flow Pulses (Dots) -->
  <circle cx="38" cy="40" r="1.5" fill="#FFFFFF" />
  <circle cx="38" cy="60" r="1.5" fill="#FFFFFF" />
  <circle cx="62" cy="37" r="1.5" fill="#FFFFFF" />
  <circle cx="62" cy="50" r="1.5" fill="#FFFFFF" />
  <circle cx="62" cy="63" r="1.5" fill="#FFFFFF" />

  <!-- Left Nodes (Clients / Ingress) -->
  <g transform="translate(18, 30)">
    <rect x="-8" y="-8" width="16" height="16" rx="4" fill="url(#clientGrad)" filter="url(#glow)" />
    <!-- Mini icon: Globe/User -->
    <circle cx="0" cy="0" r="3" fill="#FFFFFF" />
  </g>
  <g transform="translate(18, 70)">
    <rect x="-8" y="-8" width="16" height="16" rx="4" fill="url(#clientGrad)" filter="url(#glow)" />
    <!-- Mini icon: Code -->
    <path d="M -2 -2 L 2 0 L -2 2" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Central Node (API Gateway Proxy Core) -->
  <g transform="translate(50, 50)">
    <!-- Outer Shield / Hexagon -->
    <polygon points="0,-18 16,-9 16,9 0,18 -16,9 -16,-9" fill="url(#coreGrad)" filter="url(#glow)" />
    <!-- Inner Geometric Detail -->
    <polygon points="0,-12 11,-6 11,6 0,12 -11,6 -11,-6" fill="#0F172A" />
    <!-- Proxy symbol: Arrows forming a circular loop -->
    <path d="M -4 -4 L 4 -4 L 4 4" fill="none" stroke="#22D3EE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 4 4 L -4 4 L -4 -4" fill="none" stroke="#A855F7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Right Nodes (Microservices / Backends) -->
  <g transform="translate(78, 24)">
    <rect x="-7" y="-7" width="14" height="14" rx="3" fill="url(#serviceGrad)" />
    <!-- Server lines -->
    <line x1="-3" y1="-2" x2="3" y2="-2" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" />
    <line x1="-3" y1="2" x2="3" y2="2" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" />
  </g>
  
  <g transform="translate(78, 50)">
    <rect x="-7" y="-7" width="14" height="14" rx="3" fill="url(#serviceGrad)" />
    <line x1="-3" y1="-2" x2="3" y2="-2" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" />
    <line x1="-3" y1="2" x2="3" y2="2" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <g transform="translate(78, 76)">
    <rect x="-7" y="-7" width="14" height="14" rx="3" fill="url(#serviceGrad)" />
    <line x1="-3" y1="-2" x2="3" y2="-2" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" />
    <line x1="-3" y1="2" x2="3" y2="2" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" />
  </g>

</svg>