<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>

    <!-- Phone Body Gradient -->
    <linearGradient id="phone-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Screen Gradient -->
    <linearGradient id="screen-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Primary Accent (Cyan to Violet) -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <!-- Secondary Accent (Emerald) -->
    <linearGradient id="emerald-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" rx="22" fill="url(#bg-grad)" />

  <!-- Ambient Glow -->
  <circle cx="50" cy="50" r="30" fill="#22D3EE" opacity="0.15" filter="url(#glow)" />
  <circle cx="50" cy="50" r="20" fill="#A855F7" opacity="0.15" filter="url(#glow)" />

  <!-- Smartphone Outer Body -->
  <rect x="29" y="10" width="42" height="80" rx="9" fill="url(#phone-grad)" stroke="#475569" stroke-width="1.5" />

  <!-- Smartphone Inner Bezel -->
  <rect x="31.5" y="12.5" width="37" height="75" rx="7" fill="url(#screen-grad)" />

  <!-- Speaker Notch / Dynamic Island -->
  <rect x="43" y="15" width="14" height="3" rx="1.5" fill="#475569" />

  <!-- App UI Elements: Header -->
  <circle cx="37" cy="27" r="2.5" fill="url(#accent-grad)" />
  <rect x="42" y="25.5" width="14" height="3" rx="1.5" fill="#334155" />
  <rect x="59" y="25" width="6" height="4" rx="2" fill="#22D3EE" opacity="0.8" />

  <!-- App UI Elements: Hero Widget -->
  <rect x="36" y="33" width="28" height="18" rx="4" fill="#1E293B" stroke="#334155" stroke-width="1" />
  <path d="M 40 45 L 45 40 L 49 43 L 56 36" fill="none" stroke="url(#accent-grad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="56" cy="36" r="2" fill="#22D3EE" />

  <!-- App UI Elements: Feature Cards (Grid) -->
  <!-- Card 1 (Cyan) -->
  <rect x="36" y="55" width="13" height="13" rx="3.5" fill="#082F49" stroke="#0EA5E9" stroke-width="0.75" />
  <circle cx="42.5" cy="61.5" r="3" fill="#22D3EE" />

  <!-- Card 2 (Violet) -->
  <rect x="51" y="55" width="13" height="13" rx="3.5" fill="#2E1065" stroke="#8B5CF6" stroke-width="0.75" />
  <path d="M 55.5 61.5 L 58 64 L 61 58" fill="none" stroke="#C084FC" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />

  <!-- App UI Elements: List items -->
  <rect x="36" y="71" width="28" height="5" rx="2.5" fill="#1E293B" />
  <circle cx="38.5" cy="73.5" r="1.5" fill="#10B981" />
  <rect x="42" y="72.5" width="14" height="2" rx="1" fill="#64748B" />

  <rect x="36" y="78" width="28" height="5" rx="2.5" fill="#1E293B" />
  <circle cx="38.5" cy="80.5" r="1.5" fill="#F59E0B" />
  <rect x="42" y="79.5" width="10" height="2" rx="1" fill="#64748B" />

  <!-- Floating Client Interaction Elements (Modern Tech Touch) -->
  <!-- Floating Node Top Right -->
  <g transform="translate(70, 22)">
    <circle cx="0" cy="0" r="7" fill="#0F172A" stroke="url(#accent-grad)" stroke-width="1.5" />
    <path d="M -3 0 L -1 2 L 3 -2" fill="none" stroke="#22D3EE" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Floating Success Badge Bottom Left -->
  <g transform="translate(20, 68)">
    <circle cx="0" cy="0" r="9" fill="#064E3B" stroke="#34D399" stroke-width="1.5" filter="url(#glow)" />
    <path d="M -3.5 -0.5 L -1 2 L 4 -3" fill="none" stroke="#34D399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Connection Lines (Subtle data streams) -->
  <path d="M 27 68 Q 28 60, 31 52" fill="none" stroke="#34D399" stroke-width="1" stroke-dasharray="2 2" opacity="0.6" />
  <path d="M 66 30 Q 69 26, 70 24" fill="none" stroke="#22D3EE" stroke-width="1" stroke-dasharray="2 2" opacity="0.6" />

  <!-- Home Indicator Bar -->
  <rect x="41" y="86" width="18" height="2" rx="1" fill="#64748B" opacity="0.6" />
</svg>