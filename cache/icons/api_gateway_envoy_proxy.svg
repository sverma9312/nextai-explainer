<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" rx="20" fill="url(#bgGrad)" />

  <!-- Connection Paths / Traffic Flow -->
  <path d="M 28 34 L 50 20 L 72 34" fill="none" stroke="#38BDF8" stroke-width="2" stroke-dasharray="3 3" opacity="0.6" />
  <path d="M 28 66 L 50 80 L 72 66" fill="none" stroke="#34D399" stroke-width="2" stroke-dasharray="3 3" opacity="0.6" />
  <path d="M 50 50 L 78 50" fill="none" stroke="#C084FC" stroke-width="2" stroke-dasharray="3 3" opacity="0.6" />

  <!-- Ingress / Client Nodes (Left) -->
  <g transform="translate(0, 0)">
    <circle cx="24" cy="34" r="8" fill="#1E293B" stroke="#38BDF8" stroke-width="2" />
    <circle cx="24" cy="34" r="3" fill="#38BDF8" />
    
    <circle cx="24" cy="66" r="8" fill="#1E293B" stroke="#34D399" stroke-width="2" />
    <circle cx="24" cy="66" r="3" fill="#34D399" />
  </g>

  <!-- Core Envoy Proxy (Center) -->
  <g filter="url(#glow)">
    <!-- Outer Shield / Hexagon -->
    <polygon points="50,15 78,31 78,69 50,85 22,69 22,31" fill="#0F172A" stroke="url(#violetGrad)" stroke-width="3" stroke-linejoin="round" />
    
    <!-- Inner Geometric Facets representing Mesh/Routing -->
    <polygon points="50,25 68,36 68,64 50,75 32,64 32,36" fill="#1E1B4B" opacity="0.8" />
    
    <!-- Central Envoy Symbol (Stylized 'E' / Gateway Node) -->
    <path d="M 58 39 L 43 39 L 43 61 L 58 61" fill="none" stroke="#C084FC" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 43 50 L 53 50" fill="none" stroke="#C084FC" stroke-width="3.5" stroke-linecap="round" />
  </g>

  <!-- Egress / Upstream Services (Right) -->
  <g transform="translate(0, 0)">
    <!-- Service A -->
    <rect x="73" y="24" width="14" height="14" rx="3" fill="#1E293B" stroke="#38BDF8" stroke-width="2" />
    <circle cx="80" cy="31" r="2.5" fill="#38BDF8" />

    <!-- Service B -->
    <rect x="73" y="43" width="14" height="14" rx="3" fill="#1E293B" stroke="#C084FC" stroke-width="2" />
    <circle cx="80" cy="50" r="2.5" fill="#C084FC" />

    <!-- Service C -->
    <rect x="73" y="62" width="14" height="14" rx="3" fill="#1E293B" stroke="#34D399" stroke-width="2" />
    <circle cx="80" cy="69" r="2.5" fill="#34D399" />
  </g>

  <!-- Data Packets / Glowing Accents -->
  <circle cx="39" cy="26" r="2" fill="#38BDF8" />
  <circle cx="61" cy="74" r="2" fill="#34D399" />
  <circle cx="64" cy="42" r="2" fill="#C084FC" />
</svg>