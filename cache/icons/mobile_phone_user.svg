<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="phoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="userGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" rx="24" fill="url(#bgGrad)"/>

  <!-- Decorative Signal Waves -->
  <path d="M72 32 C 77 37, 77 43, 72 48" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M77 28 C 85 35, 85 45, 77 52" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.3"/>

  <!-- User Head & Shoulders -->
  <g filter="url(#shadow)">
    <!-- Shoulders / Body -->
    <path d="M 22 84 C 22 68, 32 60, 44 60 C 56 60, 66 68, 66 84 Z" fill="url(#userGrad)"/>
    <!-- Head -->
    <circle cx="44" cy="42" r="14" fill="url(#userGrad)"/>
  </g>

  <!-- Mobile Phone -->
  <g filter="url(#shadow)">
    <!-- Phone Body -->
    <rect x="52" y="24" width="34" height="62" rx="7" fill="url(#phoneGrad)"/>
    <!-- Screen -->
    <rect x="55" y="29" width="28" height="52" rx="4" fill="#0F172A"/>
    <!-- Screen Content (Abstract UI) -->
    <rect x="59" y="36" width="20" height="4" rx="2" fill="#22D3EE" opacity="0.8"/>
    <rect x="59" y="44" width="14" height="3" rx="1.5" fill="#FFFFFF" opacity="0.4"/>
    <circle cx="69" cy="62" r="7" fill="#A855F7" opacity="0.8"/>
    <!-- Speaker Notch -->
    <rect x="63" y="26" width="12" height="1.5" rx="0.75" fill="#FFFFFF" opacity="0.4"/>
  </g>
</svg>