<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>

    <!-- Cylinder Body Gradient (PostgreSQL Blue inspired) -->
    <linearGradient id="cyl-body" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#336791" />
      <stop offset="50%" stop-color="#4189C7" />
      <stop offset="100%" stop-color="#2C5270" />
    </linearGradient>

    <!-- Cylinder Top Gradient -->
    <linearGradient id="cyl-top" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#529BE4" />
      <stop offset="100%" stop-color="#336791" />
    </linearGradient>

    <!-- Elephant Accent Gradient -->
    <linearGradient id="ele-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#336791" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" rx="20" fill="url(#bg-grad)" />

  <!-- Data Flow Rings / Accent Lines -->
  <ellipse cx="50" cy="50" rx="40" ry="16" fill="none" stroke="#22D3EE" stroke-width="0.5" stroke-opacity="0.3" stroke-dasharray="4 4" />
  <ellipse cx="50" cy="65" rx="42" ry="17" fill="none" stroke="#A855F7" stroke-width="0.5" stroke-opacity="0.3" />

  <!-- DATABASE STACK -->

  <!-- Cylinder 3 (Bottom) -->
  <g transform="translate(0, 24)">
    <path d="M 20 50 C 20 58, 80 58, 80 50 L 80 68 C 80 76, 20 76, 20 68 Z" fill="url(#cyl-body)" />
    <ellipse cx="50" cy="50" rx="30" ry="8" fill="url(#cyl-top)" stroke="#38BDF8" stroke-width="0.75" />
    <!-- Status light -->
    <circle cx="65" cy="59" r="2" fill="#10B981" filter="url(#glow)" />
  </g>

  <!-- Cylinder 2 (Middle) -->
  <g transform="translate(0, 12)">
    <path d="M 20 50 C 20 58, 80 58, 80 50 L 80 68 C 80 76, 20 76, 20 68 Z" fill="url(#cyl-body)" />
    <ellipse cx="50" cy="50" rx="30" ry="8" fill="url(#cyl-top)" stroke="#38BDF8" stroke-width="0.75" />
    <!-- Data lines -->
    <path d="M 35 59 L 45 59" stroke="#93C5FD" stroke-width="1.5" stroke-linecap="round" />
    <path d="M 50 59 L 55 59" stroke="#93C5FD" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Cylinder 1 (Top) -->
  <g transform="translate(0, 0)">
    <!-- Shadow beneath top cylinder -->
    <ellipse cx="50" cy="50" rx="30" ry="8" fill="#1E293B" opacity="0.3" />
    
    <path d="M 20 50 C 20 58, 80 58, 80 50 L 80 68 C 80 76, 20 76, 20 68 Z" fill="url(#cyl-body)" />
    <ellipse cx="50" cy="50" rx="30" ry="8" fill="url(#cyl-top)" stroke="#38BDF8" stroke-width="1.5" />
    
    <!-- PostgreSQL Elephant Silhouette / Modern Iconographic Touch -->
    <path d="M 44 46 C 44 45, 46 44, 48 45 C 50 46, 52 45, 54 46 C 56 47, 56 49, 54 51 C 52 52, 48 53, 46 51 C 44 49, 44 47, 44 46 Z" fill="#22D3EE" opacity="0.8" />
    <path d="M 53 49 C 55 49, 58 51, 57 54" fill="none" stroke="#22D3EE" stroke-width="1.5" stroke-linecap="round" />

    <!-- Active Read/Write indicator -->
    <circle cx="65" cy="59" r="2.5" fill="#22D3EE" filter="url(#glow)" />
  </g>

  <!-- Floating Data Particles / Modern accents -->
  <circle cx="28" cy="30" r="1.5" fill="#38BDF8" />
  <path d="M 28 35 L 32 31" stroke="#38BDF8" stroke-width="1" stroke-linecap="round" opacity="0.6" />
  
  <circle cx="72" cy="24" r="2" fill="#A855F7" filter="url(#glow)" />
  <circle cx="75" cy="72" r="1.5" fill="#22D3EE" />

  <!-- Connection / Sync Node -->
  <path d="M 50 78 L 50 86" stroke="#22D3EE" stroke-width="2" stroke-linecap="round" />
  <circle cx="50" cy="88" r="3" fill="#10B981" filter="url(#glow)" />

</svg>