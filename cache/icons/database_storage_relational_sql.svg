<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="dbGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="dbGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="dbGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background glow / ambient circles -->
  <circle cx="50" cy="50" r="45" fill="#0F172A"/>

  <!-- Relational Connection Lines (SQL Network) -->
  <g opacity="0.6">
    <line x1="30" y1="30" x2="70" y2="30" stroke="#22D3EE" stroke-width="1.5" stroke-dasharray="3 3"/>
    <line x1="30" y1="50" x2="70" y2="50" stroke="#10B981" stroke-width="1.5"/>
    <line x1="50" y1="30" x2="50" y2="70" stroke="#A855F7" stroke-width="1.5" stroke-dasharray="3 3"/>
    <line x1="30" y1="30" x2="50" y2="70" stroke="#F59E0B" stroke-width="1.5"/>
    <line x1="70" y1="30" x2="50" y2="70" stroke="#22D3EE" stroke-width="1.5"/>
  </g>

  <!-- Relational Nodes (SQL / Data Points) -->
  <circle cx="30" cy="30" r="4" fill="#22D3EE" filter="url(#glow)"/>
  <circle cx="70" cy="30" r="4" fill="#A855F7" filter="url(#glow)"/>
  <circle cx="30" cy="50" r="4" fill="#10B981" filter="url(#glow)"/>
  <circle cx="70" cy="50" r="4" fill="#F59E0B" filter="url(#glow)"/>
  <circle cx="50" cy="70" r="4" fill="#22D3EE" filter="url(#glow)"/>
  <circle cx="50" cy="30" r="3" fill="#FFFFFF"/>
  <circle cx="50" cy="50" r="3" fill="#FFFFFF"/>

  <!-- Database Cylinder Stack -->
  <!-- Bottom Disk/Layer -->
  <g transform="translate(0, 22)">
    <path d="M 28 55 C 28 49, 72 49, 72 55 L 72 68 C 72 74, 28 74, 28 68 Z" fill="url(#dbGrad3)"/>
    <ellipse cx="50" cy="55" rx="22" ry="6" fill="#34D399"/>
    <path d="M 28 55 C 28 61, 72 61, 72 55" fill="none" stroke="#065F46" stroke-width="1.5" opacity="0.4"/>
  </g>

  <!-- Middle Disk/Layer -->
  <g transform="translate(0, 11)">
    <path d="M 28 55 C 28 49, 72 49, 72 55 L 72 68 C 72 74, 28 74, 28 68 Z" fill="url(#dbGrad2)"/>
    <ellipse cx="50" cy="55" rx="22" ry="6" fill="#C084FC"/>
    <path d="M 28 55 C 28 61, 72 61, 72 55" fill="none" stroke="#581C87" stroke-width="1.5" opacity="0.4"/>
    <!-- Data slot accent -->
    <line x1="42" y1="58" x2="58" y2="58" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- Top Disk/Layer -->
  <g transform="translate(0, 0)">
    <path d="M 28 55 C 28 49, 72 49, 72 55 L 72 68 C 72 74, 28 74, 28 68 Z" fill="url(#dbGrad1)"/>
    <ellipse cx="50" cy="55" rx="22" ry="6" fill="#67E8F9"/>
    <path d="M 28 55 C 28 61, 72 61, 72 55" fill="none" stroke="#155E75" stroke-width="1.5" opacity="0.4"/>
    <!-- Data slot accent -->
    <circle cx="44" cy="55" r="2" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="50" cy="55" r="2" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="56" cy="55" r="2" fill="#FFFFFF" opacity="0.9"/>
  </g>
</svg>