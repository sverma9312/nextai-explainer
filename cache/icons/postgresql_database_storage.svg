<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="dbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="100" height="100" rx="22" fill="#0F172A"/>

  <!-- Cylinder 3 (Bottom) -->
  <g filter="url(#shadow)">
    <path d="M 25 67 C 25 73, 75 73, 75 67 L 75 80 C 75 86, 25 86, 25 80 Z" fill="url(#dbGrad)"/>
    <ellipse cx="50" cy="67" rx="25" ry="7" fill="#60A5FA"/>
  </g>

  <!-- Cylinder 2 (Middle) -->
  <g filter="url(#shadow)">
    <path d="M 25 45 C 25 51, 75 51, 75 45 L 75 58 C 75 64, 25 64, 25 58 Z" fill="url(#dbGrad)"/>
    <ellipse cx="50" cy="45" rx="25" ry="7" fill="#60A5FA"/>
  </g>

  <!-- Cylinder 1 (Top) -->
  <g filter="url(#shadow)">
    <path d="M 25 23 C 25 29, 75 29, 75 23 L 75 36 C 75 42, 25 42, 25 36 Z" fill="url(#dbGrad)"/>
    <ellipse cx="50" cy="23" rx="25" ry="7" fill="#93C5FD"/>
  </g>

  <!-- Data Flow / Elephant Tusk / Storage Curves -->
  <path d="M 35 34 C 45 42, 55 42, 65 34" fill="none" stroke="url(#accentGrad)" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 35 56 C 45 64, 55 64, 65 56" fill="none" stroke="url(#accentGrad)" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Connection Nodes / Database Activity -->
  <circle cx="50" cy="23" r="3" fill="#22D3EE"/>
  <circle cx="50" cy="45" r="3" fill="#22D3EE"/>
  <circle cx="50" cy="67" r="3" fill="#22D3EE"/>
</svg>