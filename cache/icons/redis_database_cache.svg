<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Cylinder Primary Gradient (Red/Coral theme for Redis) -->
    <linearGradient id="redis-red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="50%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>

    <!-- Cylinder Top Ellipse Gradient -->
    <linearGradient id="redis-top" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F87171" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>

    <!-- Lightning / Speed Accent Gradient -->
    <linearGradient id="speed-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="100" height="100" rx="22" fill="url(#bg-grad)" />

  <!-- Database Stack (Bottom Cylinder) -->
  <g transform="translate(0, 16)">
    <!-- Body -->
    <path d="M 25 50 L 25 65 C 25 73, 75 73, 75 65 L 75 50 Z" fill="url(#redis-red)" />
    <!-- Data Band / Glow Line -->
    <path d="M 25 57.5 C 25 64.5, 75 64.5, 75 57.5" fill="none" stroke="#FCA5A5" stroke-width="1.5" opacity="0.6" />
    <!-- Top Rim -->
    <ellipse cx="50" cy="50" rx="25" ry="8" fill="url(#redis-top)" />
  </g>

  <!-- Database Stack (Middle Cylinder) -->
  <g transform="translate(0, 8)">
    <!-- Body -->
    <path d="M 25 50 L 25 65 C 25 73, 75 73, 75 65 L 75 50 Z" fill="url(#redis-red)" />
    <!-- Data Band / Glow Line -->
    <path d="M 25 57.5 C 25 64.5, 75 64.5, 75 57.5" fill="none" stroke="#FCA5A5" stroke-width="1.5" opacity="0.6" />
    <!-- Top Rim -->
    <ellipse cx="50" cy="50" rx="25" ry="8" fill="url(#redis-top)" />
  </g>

  <!-- Database Stack (Top Cylinder) -->
  <g transform="translate(0, 0)">
    <!-- Body -->
    <path d="M 25 50 L 25 65 C 25 73, 75 73, 75 65 L 75 50 Z" fill="url(#redis-red)" />
    <!-- Data Band / Glow Line -->
    <path d="M 25 57.5 C 25 64.5, 75 64.5, 75 57.5" fill="none" stroke="#FCA5A5" stroke-width="1.5" opacity="0.8" />
    <!-- Top Rim -->
    <ellipse cx="50" cy="50" rx="25" ry="8" fill="url(#redis-top)" />
    
    <!-- Connection Dots on Top Disk -->
    <circle cx="43" cy="49" r="1.5" fill="#FEF2F2" opacity="0.9" />
    <circle cx="50" cy="52" r="1.5" fill="#FEF2F2" opacity="0.9" />
    <circle cx="57" cy="49" r="1.5" fill="#FEF2F2" opacity="0.9" />
  </g>

  <!-- High-Speed Cache Lightning Bolt (Overlay) -->
  <g filter="url(#glow)">
    <path d="M 54 18 
             L 38 43 
             L 48 43 
             L 43 68 
             L 65 37 
             L 53 37 
             Z" 
          fill="url(#speed-gold)" 
          stroke="#FFFFFF" 
          stroke-width="1.5" 
          stroke-linejoin="round" />
  </g>

</svg>