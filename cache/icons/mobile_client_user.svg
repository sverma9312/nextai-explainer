<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="phoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="userGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" rx="22" fill="url(#bgGrad)" />

  <!-- Mobile Phone Body -->
  <rect x="28" y="16" width="44" height="68" rx="8" fill="url(#phoneGrad)" opacity="0.9" />
  <rect x="31" y="20" width="38" height="60" rx="5" fill="#0F172A" />

  <!-- Screen Header / Speaker -->
  <rect x="44" y="23" width="12" height="2.5" rx="1.25" fill="#334155" />

  <!-- Abstract UI Elements inside Phone -->
  <rect x="36" y="30" width="18" height="3" rx="1.5" fill="#38BDF8" opacity="0.6" />
  <rect x="36" y="35" width="28" height="2" rx="1" fill="#64748B" opacity="0.4" />

  <!-- User Avatar (Mobile Client) -->
  <g filter="url(#glow)">
    <!-- User Body / Shoulders -->
    <path d="M 37 72 C 37 63 43 60 50 60 C 57 60 63 63 63 72 Z" fill="url(#userGrad)" />
    <!-- User Head -->
    <circle cx="50" cy="48" r="8" fill="url(#userGrad)" />
  </g>

  <!-- Floating Accent Elements -->
  <circle cx="76" cy="30" r="4" fill="#F59E0B" />
  <circle cx="21" cy="65" r="3" fill="#A855F7" />
  <path d="M 72 68 L 78 68 M 75 65 L 75 71" stroke="#22D3EE" stroke-width="2.5" stroke-linecap="round" />
</svg>