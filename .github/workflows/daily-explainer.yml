name: Daily Architecture Explainer Generator

on:
  schedule:
    # Runs daily at 10:00 UTC (03:30 PM IST)
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      retry_last:
        description: 'Retry uploading last explainer video (skips already posted platforms unless force=true)'
        required: false
        type: boolean
        default: false
      publish_youtube:
        description: 'Publish / retry YouTube (Full 16:9 Landscape Video)'
        required: false
        type: boolean
        default: false
      publish_instagram:
        description: 'Publish / retry Instagram Reels'
        required: false
        type: boolean
        default: false
      topic:
        description: 'Specific topic ID or custom prompt (e.g. uber-h3-matching, or "LinkedIn Kafka: 7 Trillion Messages")'
        required: false
        type: string
        default: ''
      force:
        description: 'Force upload even if URL already exists in archive ledger'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Run script and audio synthesis without rendering full MP4'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 12

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install system dependencies for headless video rendering
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-color-emoji

      - name: Install Node dependencies
        run: pnpm install

      - name: Download Previous Video Artifact (Retry Mode)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.retry_last }}
        run: |
          mkdir -p out build
          echo "Looking for previous workflow run artifact to reuse rendered video..."
          PREV_RUN_ID=$(gh run list --workflow="daily-explainer.yml" --limit 5 --json databaseId -q '.[] | select(.databaseId != ${{ github.run_id }}) | .databaseId' | head -n 1)
          if [ -n "$PREV_RUN_ID" ]; then
            echo "Downloading artifacts from run #$PREV_RUN_ID..."
            gh run download "$PREV_RUN_ID" --dir ./downloaded_artifacts || true
            find ./downloaded_artifacts -name "*.mp4" -exec cp {} out/ \; || true
            find ./downloaded_artifacts -name "*_audio.mp3" -exec cp {} build/ \; || true
            find ./downloaded_artifacts -name "*_subtitles.json" -exec cp {} build/ \; || true
            rm -rf ./downloaded_artifacts
          fi
          echo "Available files in out/:"
          ls -la out/ || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Explainer Generation Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VIDEO_VOICE_NAME: 'en-US-AndrewNeural'
          VIDEO_VOICE_RATE: '+14%'
          RETRY_LAST: ${{ inputs.retry_last }}
          ENABLE_YOUTUBE_PUBLISH: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish_youtube) || vars.ENABLE_YOUTUBE_PUBLISH || secrets.ENABLE_YOUTUBE_PUBLISH || 'false' }}
          ENABLE_INSTAGRAM_PUBLISH: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish_instagram) || vars.ENABLE_INSTAGRAM_PUBLISH || secrets.ENABLE_INSTAGRAM_PUBLISH || 'false' }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY_STATUS: ${{ vars.YOUTUBE_PRIVACY_STATUS || 'public' }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: |
          FLAGS=""
          if [ "${{ inputs.retry_last }}" = "true" ]; then
            FLAGS="$FLAGS --retry-last"
          fi
          if [ "${{ inputs.force }}" = "true" ]; then
            FLAGS="$FLAGS --force"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            FLAGS="$FLAGS --dry-run"
          fi
          if [ -n "${{ inputs.topic }}" ]; then
            FLAGS="$FLAGS --topic ${{ inputs.topic }}"
          fi
          pnpm generate:latest $FLAGS

      - name: Upload Rendered Video Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-explainer-video-${{ github.run_number }}
          path: |
            out/*.mp4
            build/*_audio.mp3
            build/*_subtitles.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit Updated Explainer Archive Ledger
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "NextAI Autonomous Explainer Bot"
          if [[ -n $(git status -s data/explainer_archive.json) ]]; then
            git add data/explainer_archive.json
            git commit -m "chore(archive): record published explainer episode [skip ci]"
            git pull --rebase origin main || true
            git push origin main || true
          else
            echo "No new topics recorded in explainer archive."
          fi

      - name: Pipeline Failure Alert & Summary
        if: failure()
        run: |
          echo "### ❌ Pipeline Execution Failed" >> $GITHUB_STEP_SUMMARY
          echo "An error occurred during video rendering or social media distribution (YouTube / Instagram)." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Repository:** \`${{ github.repository }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Run Number:** \`#${{ github.run_number }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered By:** \`${{ github.actor }}\` (\`${{ github.event_name }}\`)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> 💡 **Alert Dispatched:** Notification sent to designated team channels. Check logs above for exact API error traces." >> $GITHUB_STEP_SUMMARY

      - name: Send Failure Notification Email to NextAI Team
        if: failure() && secrets.NOTIFY_EMAIL_PASS != ''
        uses: dawidd6/action-send-mail@v24
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.NOTIFY_EMAIL_USER || 'nextaiapps.team@gmail.com' }}
          password: ${{ secrets.NOTIFY_EMAIL_PASS }}
          subject: "🚨 [${{ github.repository }}] Pipeline Failure Alert (Run #${{ github.run_number }})"
          to: ${{ secrets.NOTIFY_EMAIL_TO || 'nextaiapps.team@gmail.com,contact@nextai-apps.com' }}
          from: "NextAI Architecture Bot <${{ secrets.NOTIFY_EMAIL_USER || 'nextaiapps.team@gmail.com' }}>"
          html_body: |
            <h2>🚨 Explainer Video Pipeline Failed</h2>
            <p>An error occurred during video rendering or social media distribution (YouTube / Instagram).</p>
            <table border="1" cellpadding="8" cellspacing="0" style="border-collapse:collapse;border-color:#e2e8f0;font-family:sans-serif;">
              <tr><td><strong>Repository</strong></td><td>${{ github.repository }}</td></tr>
              <tr><td><strong>Workflow</strong></td><td>${{ github.workflow }}</td></tr>
              <tr><td><strong>Run Number</strong></td><td>#${{ github.run_number }}</td></tr>
              <tr><td><strong>Triggered By</strong></td><td>${{ github.actor }} (${{ github.event_name }})</td></tr>
            </table>
            <p style="margin-top:20px;">
              <a href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" style="background-color:#FF4820;color:white;padding:10px 16px;text-decoration:none;border-radius:6px;font-weight:bold;display:inline-block;">
                View Failed Run & Logs in GitHub Actions
              </a>
            </p>

